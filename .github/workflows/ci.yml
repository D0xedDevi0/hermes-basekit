name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Offline unit tests (no network, no PyPI deps)
        run: python -m pytest tests/test_core.py tests/test_desktop_plugin.py tests/test_plugin_surface.py -q
      - name: Manifest sanity
        run: python -c "import yaml,pathlib;d=yaml.safe_load(pathlib.Path('plugin.yaml').read_text());assert d['name']=='basekit';assert d['manifest_version']==2;assert d['python_dependencies']==[];print('manifest ok')"
